# Runs the three offline test suites (INSTALL.md > Test) on every pull request and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Window tests
        run: python -m unittest discover -s tests -t .
      - name: Dictation client tests
        working-directory: dictation
        run: python -m unittest discover -s util -p "test_*.py" -t .
      - name: Diagnosis skill tests
        run: python -B -m unittest discover -s skills/utter-stabilise/tests
