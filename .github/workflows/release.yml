# Builds the "Download latest release" zip when a version tag is pushed (e.g. git tag v0.1.0).
# The zip is the app source plus INSTALL.md; setup itself follows INSTALL.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: git archive --format=zip --prefix=utter/ -o utter-windows.zip HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" utter-windows.zip \
            --title "Utter $GITHUB_REF_NAME" \
            --notes "Unzip, then follow INSTALL.md (or paste the setup prompt from the launch page into your coding agent)."
